
name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows ${{ matrix.name }}
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x64
            directory: windows-intel64
            msvc_arch: amd64

          - name: arm64
            directory: windows-aarch64
            msvc_arch: amd64_arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Create build directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build

      - name: Build Kakao Killer
        shell: pwsh
        run: |
          $source = "src/${{ matrix.directory }}/main.c"
          $output = "kkokiler-${{ matrix.name }}.exe"

          cl /nologo /O2 /MT /W4 `
            /DUNICODE /D_UNICODE `
            $source `
            "/Fe:build/$output" `
            /link /SUBSYSTEM:WINDOWS

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Embed executable into installer
        shell: pwsh
        run: |
          $exe = "kkokiler-${{ matrix.name }}.exe"

          Copy-Item "build/$exe" "build/kkokiler.exe"

          '101 RCDATA "kkokiler.exe"' |
            Set-Content "build/payload.rc" -Encoding ascii

          Push-Location build

          rc /nologo /fo payload.res payload.rc
          $result = $LASTEXITCODE

          Pop-Location

          if ($result -ne 0) {
            exit $result
          }

      - name: Build installer
        shell: pwsh
        run: |
          $source = "src/${{ matrix.directory }}/Installer.c"
          $output = "kkokilerinstaller-${{ matrix.name }}.exe"

          cl /nologo /O2 /MT /W4 `
            /DUNICODE /D_UNICODE `
            $source `
            build/payload.res `
            shell32.lib advapi32.lib user32.lib `
            "/Fe:build/$output" `
            /link /SUBSYSTEM:WINDOWS

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kakaokiller-${{ matrix.name }}
          path: |
            build/kkokiler-${{ matrix.name }}.exe
            build/kkokilerinstaller-${{ matrix.name }}.exe

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: kakaokiller-*
          path: dist
          merge-multiple: true

      - name: Publish Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/*.exe